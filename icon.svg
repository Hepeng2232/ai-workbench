<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background: deep space gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%">
      <stop offset="0%" stop-color="#1C2235"/>
      <stop offset="55%" stop-color="#11141F"/>
      <stop offset="100%" stop-color="#0A0C12"/>
    </radialGradient>
    <!-- Ambient glow -->
    <radialGradient id="ambient" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#6B7FB5" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#4A3C6E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A0C12" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold gradient for hexagon frame -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4E4BC"/>
      <stop offset="35%" stop-color="#D4AF6A"/>
      <stop offset="65%" stop-color="#B8924E"/>
      <stop offset="100%" stop-color="#8B6E32"/>
    </linearGradient>
    <!-- Inner hexagon gradient -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C9A961" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B6F3A" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Central orb -->
    <radialGradient id="orbGrad" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="25%" stop-color="#F0D88A"/>
      <stop offset="60%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#7A5E2E"/>
    </radialGradient>
    <!-- Orb glow -->
    <radialGradient id="orbGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#E8C97A" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C9A961" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
    <!-- Top reflection -->
    <linearGradient id="reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip for inner content -->
    <clipPath id="hexClip">
      <polygon points="256,96 388,172 388,324 256,400 124,324 124,172"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#ambient)"/>

  <!-- Outer hexagon frame -->
  <polygon points="256,80 400,163 400,349 256,432 112,349 112,163"
    fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round" opacity="0.35"/>

  <!-- Main hexagon -->
  <polygon points="256,96 388,172 388,324 256,400 124,324 124,172"
    fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner hexagon (rotated) -->
  <polygon points="256,140 350,194 350,306 256,360 162,306 162,194"
    fill="none" stroke="url(#innerGrad)" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>

  <!-- Innermost hexagon -->
  <polygon points="256,180 314,214 314,298 256,332 198,298 198,214"
    fill="none" stroke="url(#innerGrad)" stroke-width="1.2" stroke-linejoin="round" opacity="0.35"/>

  <!-- Orb glow -->
  <circle cx="256" cy="248" r="100" fill="url(#orbGlow)"/>

  <!-- Central orb -->
  <circle cx="256" cy="248" r="52" fill="url(#orbGrad)"/>

  <!-- Orb rim light -->
  <circle cx="256" cy="248" r="52" fill="none" stroke="#FFF6E0" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="248" r="52" fill="none" stroke="#8B6F3A" stroke-width="0.8" opacity="0.4"/>

  <!-- Orb highlight -->
  <ellipse cx="240" cy="232" rx="18" ry="12" fill="#FFFFFF" opacity="0.25" transform="rotate(-30 240 232)"/>
  <circle cx="234" cy="228" r="5" fill="#FFFFFF" opacity="0.5"/>

  <!-- Orb shadow detail -->
  <ellipse cx="264" cy="266" rx="22" ry="14" fill="#7A5E2E" opacity="0.2"/>

  <!-- Connecting lines from hexagon vertices to center -->
  <line x1="256" y1="96" x2="256" y2="196" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.2"/>
  <line x1="388" y1="172" x2="308" y2="226" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.2"/>
  <line x1="388" y1="324" x2="308" y2="270" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.2"/>
  <line x1="256" y1="400" x2="256" y2="300" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.2"/>
  <line x1="124" y1="324" x2="204" y2="270" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.2"/>
  <line x1="124" y1="172" x2="204" y2="226" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.2"/>

  <!-- Stars/particles -->
  <circle cx="140" cy="110" r="1.2" fill="#E8C97A" opacity="0.5"/>
  <circle cx="372" cy="130" r="1" fill="#E8C97A" opacity="0.4"/>
  <circle cx="400" cy="380" r="1.5" fill="#E8C97A" opacity="0.3"/>
  <circle cx="110" cy="400" r="1" fill="#E8C97A" opacity="0.4"/>
  <circle cx="80" cy="256" r="0.8" fill="#C9A961" opacity="0.3"/>
  <circle cx="432" cy="256" r="0.8" fill="#C9A961" opacity="0.3"/>

  <!-- Top glass reflection on background -->
  <rect width="512" height="256" rx="112" fill="url(#reflect)" opacity="0.5"/>
</svg>